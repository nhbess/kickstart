[project]
name = "kickstart"
version = "0.1.0"
description = "Personal project bootstrapper for uv and Cursor."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
kickstart = "kickstart.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kickstart"]

[tool.hatch.build.targets.sdist]
include = [
    "/README.md",
    "/pyproject.toml",
    "/src",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
